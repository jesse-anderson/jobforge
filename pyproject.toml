[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jobforge"
dynamic = ["version"]
description = "Tailored resumes and cover letters from your real work history, run locally, with every fact checked."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Jesse Anderson" }, { name = "Mike Wilson" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
]
# The runtime is stdlib only (D-13). Nothing goes in `dependencies`.
dependencies = []

[project.urls]
Homepage = "https://github.com/jesse-anderson/jobforge"
Source = "https://github.com/jesse-anderson/jobforge"
Issues = "https://github.com/jesse-anderson/jobforge/issues"
Security = "https://github.com/jesse-anderson/jobforge/security/policy"

[project.optional-dependencies]
dev = ["pytest>=8", "coverage>=7"]

[project.scripts]
jobforge = "jobforge.cli:main"

[tool.setuptools.dynamic]
version = { attr = "jobforge.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobforge = ["agent/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "critical: D-30 critical path; must stay at 100% coverage",
]

[tool.coverage.run]
source = ["jobforge"]
branch = true

[tool.coverage.report]
show_missing = true

# Critical paths (D-30, D-51): held to 100% line and branch coverage by
# `python tools/critical_coverage.py`, in CI and before every push.
[tool.jobforge]
critical = [
    "workspace.py", "profile.py", "agent/__init__.py",   # setup
    "extract.py", "prepare.py",                          # job intake
    "plan.py",                                           # plan validation
    "render.py", "docx.py",                              # rendering
    "scan.py", "factcheck.py", "facts.py", "apply.py",   # safety
    "ledger.py", "importer.py",                          # ledger
    "confirm.py",                                        # facts going live
]
