# Release (#54). Runs only when a maintainer pushes a version tag, never on a
# branch push or a PR. Publishes with PyPI trusted publishing (OIDC), so no
# token is stored anywhere.
#
#   v0.1.0 (final X.Y.Z)                    -> PyPI
#   v0.1.0rc1, v0.1.0b1, v0.1.0a1 (pre-release) -> TestPyPI, then PyPI if
#       that succeeded. Until a final release exists, plain
#       `pip install jobforge` installs the newest pre-release.
#   anything else, e.g. v0.1.0.dev1             -> TestPyPI only
#
# Nothing uploads until the built wheel passes the clean-machine checklist on
# a fresh Windows runner (tools/clean_windows.ps1, #56): the exact file about
# to be published, installed and used the way the README says.
#
# The `testpypi` and `pypi` environments deploy from `v*` tags only; a
# required reviewer is added at the public flip (a private repo on the Free
# plan cannot have one). PyPI never lets a version be reused, even after
# deletion, so the tag must match __version__, and PyPI never takes a .dev
# build (tools/release_check.py).
#
# One-time setup, before the first tag: on PyPI and TestPyPI, add this repo as
# a trusted publisher (workflow `release.yml`, environment `pypi` or
# `testpypi`), and create both environments here with required reviewers.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      target: ${{ steps.target.outputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Choose the target from the tag
        id: target
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "target=pypi" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(a|b|rc)[0-9]+$ ]]; then
            echo "target=both" >> "$GITHUB_OUTPUT"
          else
            echo "target=testpypi" >> "$GITHUB_OUTPUT"
          fi
      - name: Tag matches the version
        shell: bash
        run: |
          if [ "${{ steps.target.outputs.target }}" != testpypi ]; then
            python tools/release_check.py "$GITHUB_REF_NAME"
          else
            python tools/release_check.py "$GITHUB_REF_NAME" --test
          fi
      - name: Test before building
        run: |
          python -m pip install -e ".[dev]"
          python -m coverage run -m pytest -q
          python -m coverage report --fail-under=95
      - name: Build and check
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Install the wheel in a clean venv and run it
        shell: bash
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/jobforge --version
          /tmp/smoke/bin/jobforge init /tmp/smoke-ws
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # The clean-machine checklist on the wheel about to be uploaded (#56). Both
  # uploads wait for it; a failure stops the release with nothing published.
  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Clean-machine checklist on the built wheel
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\clean_windows.ps1 -Install wheel -Out clean-windows-out
      - name: Save the transcript and documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-windows-release
          path: clean-windows-out/

  testpypi:
    needs: [build, windows]
    if: needs.build.outputs.target == 'testpypi' || needs.build.outputs.target == 'both'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/jobforge
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: [build, windows, testpypi]
    # A pre-release reaches PyPI only after its TestPyPI upload succeeded; a
    # final version skips TestPyPI, so the skipped job must not block it.
    # Either way the Windows checklist must have passed.
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      needs.windows.result == 'success' &&
      (needs.build.outputs.target == 'pypi' ||
       (needs.build.outputs.target == 'both' && needs.testpypi.result == 'success'))
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jobforge
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
