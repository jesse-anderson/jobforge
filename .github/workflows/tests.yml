# Tests only (D-15). Never scrapes, never runs on a schedule, never touches
# the network from a test. Runs on pushes to main and on pull requests, and
# cancels superseded runs. Linux and Windows, both supported platforms (the
# repo is public from launch, so Actions minutes are free).
name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      # T-PII reads the denylist from the PII_DENYLIST secret (one term per
      # line) and skips with a warning when it is unset. Only this step sees
      # the secret; a step's own env cannot gate its `if:`, so the check is in
      # the script.
      - name: Test with coverage
        shell: bash
        env:
          PII_DENYLIST: ${{ secrets.PII_DENYLIST }}
        run: |
          if [ -n "$PII_DENYLIST" ]; then
            printf '%s\n' "$PII_DENYLIST" > "$RUNNER_TEMP/pii_denylist.txt"
            export JOBFORGE_PII_DENYLIST="$RUNNER_TEMP/pii_denylist.txt"
          fi
          python -m coverage run -m pytest -q -rs
          python -m coverage report --fail-under=95
          python tools/critical_coverage.py
      # The README's coverage badge is a static number (#101). This fails when
      # it is not the measured one; the message gives the badge to paste.
      # One Python only, so a rounding difference between versions cannot
      # make the two jobs disagree.
      - name: Check the README coverage badge
        if: matrix.python == '3.13' && matrix.os == 'ubuntu-latest'
        run: |
          python -m coverage json -o coverage.json
          python tools/coverage_badge.py coverage.json README.md
