# Tests only (D-15). Never scrapes, never runs on a schedule, never touches
# the network from a test. Runs on pushes to main and on pull requests, and
# cancels superseded runs. Ubuntu only while the repo is private, since
# Windows minutes bill at 2x; add windows-latest back to the matrix at launch
# (the public flip), when Actions minutes are free.
name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      # T-PII reads the denylist from the PII_DENYLIST secret (one term per
      # line) and skips with a warning when it is unset. Only this step sees
      # the secret; a step's own env cannot gate its `if:`, so the check is in
      # the script.
      - name: Test with coverage
        shell: bash
        env:
          PII_DENYLIST: ${{ secrets.PII_DENYLIST }}
        run: |
          if [ -n "$PII_DENYLIST" ]; then
            printf '%s\n' "$PII_DENYLIST" > "$RUNNER_TEMP/pii_denylist.txt"
            export JOBFORGE_PII_DENYLIST="$RUNNER_TEMP/pii_denylist.txt"
          fi
          python -m coverage run -m pytest -q -rs
          python -m coverage report --fail-under=95

  # Coverage badge (#48), the same shields.io endpoint file as linreg-core,
  # published to GitHub Pages instead of committed (D-48), with no token.
  # Runs on main once the repo is public: Pages is off while it is private,
  # and badges do not render for visitors before the flip anyway. At the
  # flip, set Settings > Pages > Source to "GitHub Actions".
  badge:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Measure coverage and write the badge
        run: |
          python -m coverage run -m pytest -q
          python -m coverage json -o coverage.json
          python tools/coverage_badge.py coverage.json _site/coverage-badge.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
