# Tests only (D-15). Never scrapes, never runs on a schedule, never touches
# the network from a test. Runs on pushes to main and on pull requests, and
# cancels superseded runs. Ubuntu only while the repo is private, since
# Windows minutes bill at 2x; add windows-latest back to the matrix at launch
# (the public flip), when Actions minutes are free.
name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      # T-PII reads the denylist from the PII_DENYLIST secret (one term per
      # line) and skips with a warning when it is unset. Only this step sees
      # the secret; a step's own env cannot gate its `if:`, so the check is in
      # the script.
      - name: Test with coverage
        shell: bash
        env:
          PII_DENYLIST: ${{ secrets.PII_DENYLIST }}
        run: |
          if [ -n "$PII_DENYLIST" ]; then
            printf '%s\n' "$PII_DENYLIST" > "$RUNNER_TEMP/pii_denylist.txt"
            export JOBFORGE_PII_DENYLIST="$RUNNER_TEMP/pii_denylist.txt"
          fi
          python -m coverage run -m pytest -q -rs
          python -m coverage report --fail-under=95
          python tools/critical_coverage.py
